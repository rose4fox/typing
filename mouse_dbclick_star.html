<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>반짝반짝! 더블클릭 별 잡기</title>
  
  <!-- 구글 폰트 Jua -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Jua', sans-serif;
      letter-spacing: 0.5px;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #f8fafc;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 38px);
      color: #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
    }

    .subtitle {
      font-size: clamp(13px, 3.2vw, 17px);
      color: #cbd5e1;
      margin-top: 4px;
    }

    /* 상단 정보창 */
    .dashboard {
      display: flex;
      gap: 16px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      padding: 8px 24px;
      border-radius: 40px;
      margin-bottom: 14px;
      font-size: clamp(14px, 3.4vw, 17px);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .dash-item span {
      color: #38bdf8;
      font-size: 1.15em;
      margin-left: 3px;
    }

    /* 게임 화면 보드 */
    .game-board {
      width: 100%;
      max-width: 860px;
      height: clamp(380px, 60vh, 500px);
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      border: 3px solid #38bdf8;
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    /* 더블클릭 대상 별 */
    .star-target {
      position: absolute;
      cursor: pointer;
      font-size: clamp(38px, 9vw, 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8));
      animation: twinkle 1s infinite alternate ease-in-out;
    }

    .star-target:active {
      transform: scale(1.2);
    }

    @keyframes twinkle {
      0% { transform: scale(0.9); opacity: 0.85; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    /* 클릭 시 터지는 이펙트 */
    .pop-effect {
      position: absolute;
      pointer-events: none;
      font-size: 28px;
      animation: popFade 0.6s ease-out forwards;
    }

    @keyframes popFade {
      0% { transform: scale(0.6) translateY(0); opacity: 1; }
      100% { transform: scale(1.6) translateY(-25px); opacity: 0; }
    }

    /* ================= 축하 종료 팝업 (반응형 최적화) ================= */
    .clear-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(8px);
      z-index: 2000;
      border-radius: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(14px, 4vw, 30px);
    }

    .clear-modal-title {
      font-size: clamp(32px, 8vw, 48px);
      color: #facc15;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
      margin-bottom: clamp(10px, 2.5vh, 18px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 단어가 어색하게 쪼개지지 않고 모바일 화면에 맞게 자동 축소 */
    .clear-modal-desc {
      font-size: clamp(16px, 4.3vw, 24px);
      color: #ffffff;
      line-height: 1.45;
      margin-bottom: clamp(18px, 4vh, 32px);
      word-break: keep-all; /* 한글 단어 단위 줄바꿈 유지 */
      max-width: 90%;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .clear-modal-desc .highlight {
      color: #38bdf8;
      font-weight: bold;
    }

    .restart-btn {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      color: #ffffff;
      border: 2px solid #67e8f9;
      padding: clamp(10px, 2.5vh, 14px) clamp(26px, 6vw, 40px);
      font-size: clamp(18px, 4.5vw, 22px);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .restart-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.8);
    }

    /* 폭죽 캔버스 */
    #fw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2500;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 반짝반짝! 더블클릭 별 잡기</h1>
    <p class="subtitle">별이 사라지기 전에 마우스로 <b>따닥!(두 번)</b> 빠르게 눌러보세요!</p>
  </header>

  <div class="dashboard">
    <div class="dash-item">남은 별: <span id="stars-count">10</span>개</div>
    <div class="dash-item">걸린 시간: <span id="time-count">0</span>초</div>
  </div>

  <div class="game-board" id="board">
    <canvas id="fw-canvas"></canvas>

    <!-- 개선된 반응형 종료 축하 화면 -->
    <div class="clear-modal" id="clear-modal">
      <div class="clear-modal-title">와아~! ⭐🎉</div>
      <p class="clear-modal-desc">
        반짝이는 별을 모두 잡은<br>
        <span class="highlight">더블클릭 챔피언!</span>
      </p>
      <button class="restart-btn" onclick="startGame()">다시 도전하기! 🔄</button>
    </div>
  </div>

  <script>
    const TOTAL_STARS = 10;
    let remainingStars = TOTAL_STARS;
    let timer = 0;
    let timerInterval = null;
    let starInterval = null;
    let isRunning = false;

    // 사운드 엔진
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playCatchSound() {
      playBeep(659.25, 0.08); // E5
      setTimeout(() => playBeep(880, 0.12), 60); // A5
    }

    function playWinSound() {
      const melody = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      melody.forEach((freq, i) => {
        setTimeout(() => playBeep(freq, 0.2, 'triangle'), i * 110);
      });
    }

    function startGame() {
      stopFireworks();
      clearInterval(timerInterval);
      clearInterval(starInterval);

      // 기존 보드 초기화
      const board = document.getElementById('board');
      document.querySelectorAll('.star-target, .pop-effect').forEach(el => el.remove());
      document.getElementById('clear-modal').style.display = 'none';

      remainingStars = TOTAL_STARS;
      timer = 0;
      isRunning = true;

      document.getElementById('stars-count').innerText = remainingStars;
      document.getElementById('time-count').innerText = timer;

      timerInterval = setInterval(() => {
        timer++;
        document.getElementById('time-count').innerText = timer;
      }, 1000);

      spawnStar();
    }

    function spawnStar() {
      if (!isRunning) return;

      const board = document.getElementById('board');
      const star = document.createElement('div');
      star.className = 'star-target';
      star.innerText = '⭐';

      const boardW = board.clientWidth;
      const boardH = board.clientHeight;
      const starSize = 60;

      const randX = Math.random() * (boardW - starSize - 20) + 10;
      const randY = Math.random() * (boardH - starSize - 20) + 10;

      star.style.left = `${randX}px`;
      star.style.top = `${randY}px`;

      // 더블클릭 이벤트 (PC dblclick + 모바일 탭 대응)
      let lastTap = 0;
      
      function handleDoubleClick(e) {
        if (!isRunning) return;
        e.stopPropagation();
        e.preventDefault();

        playCatchSound();
        createPopEffect(parseFloat(star.style.left) + 20, parseFloat(star.style.top) + 20);
        star.remove();

        remainingStars--;
        document.getElementById('stars-count').innerText = remainingStars;

        if (remainingStars <= 0) {
          gameClear();
        } else {
          setTimeout(spawnStar, 250);
        }
      }

      // PC 더블클릭
      star.addEventListener('dblclick', handleDoubleClick);

      // 모바일 터치 더블 탭
      star.addEventListener('touchend', (e) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 350 && tapLength > 0) {
          handleDoubleClick(e);
        }
        lastTap = currentTime;
      });

      board.appendChild(star);
    }

    function createPopEffect(x, y) {
      const board = document.getElementById('board');
      const pop = document.createElement('div');
      pop.className = 'pop-effect';
      pop.innerText = '✨';
      pop.style.left = `${x}px`;
      pop.style.top = `${y}px`;
      board.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    function gameClear() {
      isRunning = false;
      clearInterval(timerInterval);
      playWinSound();

      document.getElementById('clear-modal').style.display = 'flex';
      startFireworks();
    }

    // 폭죽 연출 엔진
    let fwCanvas = document.getElementById('fw-canvas');
    let fwCtx = fwCanvas.getContext('2d');
    let particles = [];
    let fwAnimId = null;

    function startFireworks() {
      fwCanvas.style.display = 'block';
      fwCanvas.width = fwCanvas.parentElement.clientWidth;
      fwCanvas.height = fwCanvas.parentElement.clientHeight;
      particles = [];

      let spawnTimer = setInterval(() => {
        if (document.getElementById('clear-modal').style.display !== 'flex') {
          clearInterval(spawnTimer);
          return;
        }
        createFireworkBatch();
      }, 250);

      renderFireworks();
    }

    function createFireworkBatch() {
      const x = Math.random() * (fwCanvas.width - 100) + 50;
      const y = Math.random() * (fwCanvas.height - 100) + 50;
      const colors = ['#facc15', '#38bdf8', '#4ade80', '#f43f5e', '#a855f7', '#fb923c'];
      
      for (let i = 0; i < 30; i++) {
        const angle = (Math.PI * 2 / 30) * i;
        const speed = Math.random() * 4 + 2;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015,
          radius: Math.random() * 3 + 2
        });
      }
    }

    function renderFireworks() {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        fwCtx.save();
        fwCtx.globalAlpha = p.alpha;
        fwCtx.fillStyle = p.color;
        fwCtx.beginPath();
        fwCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        fwCtx.fill();
        fwCtx.restore();
      }
      fwAnimId = requestAnimationFrame(renderFireworks);
    }

    function stopFireworks() {
      if (fwAnimId) cancelAnimationFrame(fwAnimId);
      fwCanvas.style.display = 'none';
      particles = [];
    }

    window.onload = startGame;
  </script>
</body>
</html>
