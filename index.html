<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컴퓨터 기초 연습실</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Jua', sans-serif;
      letter-spacing: 0.3px;
    }

    body {
      background-color: #f4f7fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* 화면 수직 중앙 정렬로 상단 쏠림 방지 */
      min-height: 100vh;
      padding: 24px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.3rem;
      color: #2c3e50;
      margin-bottom: 6px;
      text-shadow: 1px 1px 0 #fff;
    }

    header p {
      font-size: 1.15rem;
      color: #64748b;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .section-title {
      font-size: 1.4rem;
      color: #34495e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 마우스 연습 2열 그리드 */
    .grid-mouse {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid-mouse {
        grid-template-columns: 1fr;
      }
    }

    /* 카드: 답답하지 않은 알맞은 높이와 두께감 */
    .card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      padding: 16px 22px; /* 상하 16px로 적당한 볼륨감 유지 */
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.12);
    }

    /* 좌측: 아이콘 + 텍스트 */
    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .card-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .icon-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .mouse-badge { background-color: #eaf2fd; }
    .dblclick-badge { background-color: #fef9e7; }
    .drag-badge { background-color: #ecfdf5; }
    .keyboard-badge { background-color: #fef3e6; }

    .card h3 {
      font-size: 1.25rem;
      color: #2c3e50;
      white-space: nowrap;
    }

    .card p {
      font-size: 1rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 우측 버튼 태그 */
    .btn-tag {
      font-size: 1rem;
      color: #2563eb;
      background-color: #eff6ff;
      padding: 7px 16px;
      border-radius: 18px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .card:hover .btn-tag {
      background: linear-gradient(145deg, #4dabf7, #3b82f6);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>🖱️ 재미있는 마우스 & 키보드 연습</h1>
    <p>원하는 활동을 선택해서 연습을 시작해 보세요!</p>
  </header>

  <main class="container">
    
    <!-- ================= 1. 마우스 연습 ================= -->
    <section>
      <div class="section-title">
        <span>🖱️</span> 마우스 연습
      </div>
      <div class="grid-mouse">
        
        <!-- 1. 풍선 클릭 -->
        <a href="https://rose4fox.github.io/typing/mouse_click_balloon.html" target="_blank" class="card">
          <div class="card-left">
            <div class="icon-badge mouse-badge">🎈</div>
            <div class="card-text">
              <h3>클릭 1</h3>
              <p>풍선 클릭!</p>
            </div>
          </div>
          <span class="btn-tag">시작하기 →</span>
        </a>

        <!-- 2. 하트 팡팡 -->
        <a href="https://rose4fox.github.io/typing/mouse_click_heart.html" target="_blank" class="card">
          <div class="card-left">
            <div class="icon-badge mouse-badge">💖</div>
            <div class="card-text">
              <h3>클릭 2</h3>
              <p>하트 팡팡!</p>
            </div>
          </div>
          <span class="btn-tag">시작하기 →</span>
        </a>

        <!-- 3. 솜사탕 팡팡 -->
        <a href="https://rose4fox.github.io/typing/mouse_click_candy.html" target="_blank" class="card">
          <div class="card-left">
            <div class="icon-badge mouse-badge">🍭</div>
            <div class="card-text">
              <h3>클릭 3</h3>
              <p>솜사탕 팡팡!</p>
            </div>
          </div>
          <span class="btn-tag">시작하기 →</span>
        </a>

        <!-- 4. 더블클릭 별 잡기 -->
        <a href="https://rose4fox.github.io/typing/mouse_dbclick_star.html" target="_blank" class="card">
          <div class="card-left">
            <div class="icon-badge dblclick-badge">⭐</div>
            <div class="card-text">
              <h3>더블클릭</h3>
              <p>반짝반짝 별 잡기!</p>
            </div>
          </div>
          <span class="btn-tag">시작하기 →</span>
        </a>

        <!-- 5. 마우스 드래그 -->
        <a href="https://rose4fox.github.io/typing/mouse_drag.html" target="_blank" class="card">
          <div class="card-left">
            <div class="icon-badge drag-badge">🎯</div>
            <div class="card-text">
              <h3>마우스 드래그</h3>
              <p>쏙쏙 상자에 넣기!</p>
            </div>
          </div>
          <span class="btn-tag">시작하기 →</span>
        </a>

      </div>
    </section>

    <!-- ================= 2. 키보드 연습 ================= -->
    <section>
      <div class="section-title">
        <span>⌨️</span> 키보드 연습
      </div>
      <div>
        <a href="https://rose4fox.github.io/typing/taja.html" target="_blank" class="card">
          <div class="card-left">
            <div class="icon-badge keyboard-badge">⌨️</div>
            <div class="card-text">
              <h3>키보드 타자 연습</h3>
              <p>1학년도 키보드 입력할 수 있어요!</p>
            </div>
          </div>
          <span class="btn-tag">시작하기 →</span>
        </a>
      </div>
    </section>

  </main>

</body>
</html>
