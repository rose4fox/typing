<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신나는 타자 연습!</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #ecfeff;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .app-container {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.08);
      text-align: center;
      border: 4px solid #a5f3fc;
      position: relative;
    }

    /* 우측 상단 관리자 톱니바퀴 */
    .admin-gear-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }
    .admin-gear-btn:hover {
      background: #e2e8f0;
      color: #334155;
    }

    /* 버튼 스타일 공통 */
    .btn-main {
      background: #06b6d4;
      color: white;
      border: none;
      font-size: 24px;
      font-weight: 800;
      padding: 18px 0;
      border-radius: 20px;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 6px 0 #0891b2;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-main:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0891b2;
    }

    .btn-save {
      background: #22c55e;
      color: white;
      border: none;
      font-size: 17px;
      font-weight: 800;
      padding: 14px 0;
      border-radius: 14px;
      width: 100%;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 0 #16a34a;
    }
    .btn-save:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #16a34a;
    }

    .btn-copy {
      background: #0284c7;
      color: white;
      border: none;
      font-size: 17px;
      font-weight: 800;
      padding: 14px 0;
      border-radius: 14px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 0 #0369a1;
    }
    .btn-copy:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0369a1;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 2px solid #cbd5e1;
      font-size: 15px;
      font-weight: bold;
      padding: 12px 0;
      border-radius: 14px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }

    /* 진행 바 */
    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background: #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #cbd5e1;
    }
    .progress-bar {
      width: 100%;
      height: 100%;
      background: #f59e0b;
      transition: width 0.1s linear;
    }

    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 8px;
    }

    /* 연습 화면 글자 및 입력창 */
    .target-word {
      font-size: clamp(40px, 12vw, 56px);
      font-weight: 900;
      color: #0f172a;
      margin: 16px 0;
      word-break: keep-all;
      letter-spacing: 2px;
    }

    .typing-input {
      width: 100%;
      font-size: 30px;
      text-align: center;
      padding: 16px;
      border-radius: 20px;
      border: 3px solid #67e8f9;
      outline: none;
      font-weight: 800;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.2s;
    }
    .typing-input:focus {
      border-color: #06b6d4;
      background: white;
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.2);
    }

    /* 완료 화면 단어 목록 카드 */
    .word-review-card {
      background: #f0fdf4;
      border-radius: 24px;
      padding: 20px 16px;
      border: 2px solid #bbf7d0;
      margin: 20px 0;
      text-align: center;
    }
    .word-review-title {
      font-size: 16px;
      font-weight: 800;
      color: #15803d;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .word-chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
    }
    .word-chip {
      background: white;
      color: #0f172a;
      font-size: 20px;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 16px;
      border: 2px solid #86efac;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 화면 전환용 클래스 */
    .screen { display: none; }
    .screen.active { display: block; }

    /* 모달 공통 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 28px;
      padding: 24px;
      text-align: left;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 3px solid #bbf7d0;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h2 {
      margin-top: 0;
      color: #15803d;
      font-size: 22px;
      text-align: center;
    }
    .modal-content label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      color: #166534;
      font-size: 14px;
    }
    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 12px 14px;
      margin-top: 6px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      font-size: 15px;
      outline: none;
    }
    .modal-content input:focus, .modal-content textarea:focus {
      border-color: #22c55e;
    }
    .modal-content textarea {
      height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    .alert-box {
      margin-top: 12px;
      background: #f0fdf4;
      border: 2px dashed #86efac;
      border-radius: 14px;
      padding: 12px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 우측 상단 선생님 설정 버튼 -->
    <button class="admin-gear-btn" onclick="openPasswordModal()" title="선생님 설정">⚙️</button>

    <!-- [화면 1] 학생 시작 화면 -->
    <div id="screenStart" class="screen active">
      <div style="font-size: 56px; margin: 10px 0 6px;">⌨️</div>
      <h1 style="color: #0891b2; font-size: 30px; margin: 0 0 10px;">신나는 타자 연습!</h1>
      <p style="color: #64748b; font-size: 17px; margin-bottom: 24px;">준비가 되면 시작 버튼을 눌러요!</p>
      
      <div style="background: #f8fafc; border-radius: 16px; padding: 14px; margin-bottom: 16px; border: 1px dashed #cbd5e1;">
        <span style="color: #475569; font-weight: bold; font-size: 15px;">
          총 <span id="totalWordCountDisplay" style="color: #0891b2;">0</span>문제 · 단어당 <span id="timeLimitDisplay" style="color: #f59e0b;">0</span>초
        </span>
      </div>

      <button class="btn-main" onclick="startGame()">시작하기</button>
    </div>

    <!-- [화면 2] 학생 타자 연습 화면 -->
    <div id="screenGame" class="screen">
      <div class="progress-bar-bg"><div class="progress-bar" id="timerBar"></div></div>
      <div class="badge" id="stepCounter">1 / 5</div>
      <div class="target-word" id="targetWord">단어</div>
      
      <input type="text" 
             id="userInput" 
             class="typing-input" 
             placeholder="여기에 입력!" 
             autocomplete="off" 
             autocorrect="off" 
             autocapitalize="off" 
             spellcheck="false">
    </div>

    <!-- [화면 3] 연습 완료 화면 (틀린 개수 제거 및 단어 목록 표시) -->
    <div id="screenResult" class="screen">
      <div style="font-size: 58px; margin: 8px 0 4px;">🌟</div>
      <h1 style="font-size: 28px; margin: 0 0 8px; color: #0f172a;">오늘의 타자 연습 완료!</h1>
      <p style="color: #15803d; font-size: 17px; font-weight: bold; margin: 0 0 16px;">
        끝까지 멋지게 연습했어요! 👏
      </p>

      <div class="word-review-card">
        <div class="word-review-title">
          <span>✨ 오늘 연습한 단어 친구들</span>
        </div>
        <div class="word-chip-container" id="completedWordChips"></div>
      </div>

      <button class="btn-main" onclick="resetToStart()">한 번 더 연습하기</button>
    </div>
  </div>

  <!-- [모달 1] 선생님 비밀번호 입력창 -->
  <div id="passwordModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 340px;">
      <h2>🔒 선생님 확인</h2>
      <p style="font-size: 14px; color: #64748b; text-align: center; margin: 0 0 16px;">
        관리자 비밀번호를 입력해주세요.
      </p>
      <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
      <button class="btn-save" onclick="checkPassword()">확인</button>
      <button class="btn-secondary" onclick="closeModals()">닫기</button>
    </div>
  </div>

  <!-- [모달 2] 선생님 문제 설정창 -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <h2>✏️ 단어 및 시간 설정</h2>
      
      <label for="inputTimeLimit">단어당 제한 시간 (초)</label>
      <input type="number" id="inputTimeLimit" value="7" min="3" max="60">

      <label for="inputWordList">연습할 단어 (줄바꿈 또는 쉼표로 구분)</label>
      <textarea id="inputWordList" placeholder="사과&#10;바나나&#10;호랑이&#10;대한민국"></textarea>

      <label for="inputNewPassword">비밀번호 변경 (선택)</label>
      <input type="password" id="inputNewPassword" placeholder="변경할 비밀번호를 입력하세요">

      <button class="btn-save" onclick="saveSettingsOnly()">💾 1. 이 컴퓨터에 설정 저장</button>
      <button class="btn-copy" onclick="generateAndCopyLink()">🔗 2. 학생용 배포 링크 복사</button>

      <div class="alert-box" id="modalAlertBox">
        <p id="modalAlertMsg" style="margin:0; font-size:13px; color:#15803d; font-weight:bold;"></p>
      </div>

      <button class="btn-secondary" onclick="closeModals()">닫기</button>
    </div>
  </div>

  <script>
    const DEFAULT_WORDS = ["사과", "바나나", "호랑이", "대한민국", "선생님", "학교"];
    const DEFAULT_TIME = 7;
    const DEFAULT_PW = "1234";

    let words = [...DEFAULT_WORDS];
    let timeLimit = DEFAULT_TIME;
    let currentPassword = DEFAULT_PW;
    
    let currentIndex = 0;
    let timerInterval = null;
    let timeLeft = 0;

    function initData() {
      const savedPw = localStorage.getItem('typing_admin_pw');
      if (savedPw) currentPassword = savedPw;

      try {
        const hash = window.location.hash.substring(1);
        if (hash) {
          const jsonStr = decodeURIComponent(atob(hash));
          const parsed = JSON.parse(jsonStr);
          if (parsed.w && parsed.w.length > 0) {
            words = parsed.w;
            timeLimit = parsed.t || DEFAULT_TIME;
            updateStartDisplay();
            return;
          }
        }
      } catch (e) {
        console.log("URL 데이터 없음/일반 로드");
      }

      const savedConfig = localStorage.getItem('typing_app_config');
      if (savedConfig) {
        try {
          const parsed = JSON.parse(savedConfig);
          words = parsed.w || DEFAULT_WORDS;
          timeLimit = parsed.t || DEFAULT_TIME;
        } catch(e) {}
      }

      updateStartDisplay();
    }

    function updateStartDisplay() {
      document.getElementById('totalWordCountDisplay').innerText = words.length;
      document.getElementById('timeLimitDisplay').innerText = timeLimit;
    }

    window.onload = function() {
      initData();

      const input = document.getElementById('userInput');
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          if (e.isComposing) return;
          submitWord();
        }
      });
    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function openPasswordModal() {
      document.getElementById('adminPasswordInput').value = '';
      document.getElementById('passwordModal').classList.add('active');
      document.getElementById('adminPasswordInput').focus();
    }

    function closeModals() {
      document.getElementById('passwordModal').classList.remove('active');
      document.getElementById('settingsModal').classList.remove('active');
      document.getElementById('modalAlertBox').style.display = 'none';
    }

    function checkPassword() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (pwd === currentPassword) {
        document.getElementById('passwordModal').classList.remove('active');
        openSettingsModal();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
        document.getElementById('adminPasswordInput').value = '';
      }
    }

    function openSettingsModal() {
      document.getElementById('inputTimeLimit').value = timeLimit;
      document.getElementById('inputWordList').value = words.join('\n');
      document.getElementById('inputNewPassword').value = '';
      document.getElementById('modalAlertBox').style.display = 'none';
      document.getElementById('settingsModal').classList.add('active');
    }

    function getParsedFormValues() {
      const timeVal = parseInt(document.getElementById('inputTimeLimit').value) || DEFAULT_TIME;
      const rawWords = document.getElementById('inputWordList').value.trim();
      if (!rawWords) {
        alert("최소 1개 이상의 단어를 입력해주세요!");
        return null;
      }
      const parsedWords = rawWords.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
      const newPw = document.getElementById('inputNewPassword').value.trim();

      return { timeVal, parsedWords, newPw };
    }

    function saveSettingsOnly() {
      const form = getParsedFormValues();
      if (!form) return;

      words = form.parsedWords;
      timeLimit = form.timeVal;
      if (form.newPw) {
        currentPassword = form.newPw;
        localStorage.setItem('typing_admin_pw', currentPassword);
      }

      localStorage.setItem('typing_app_config', JSON.stringify({ w: words, t: timeLimit }));
      updateStartDisplay();

      const alertBox = document.getElementById('modalAlertBox');
      const alertMsg = document.getElementById('modalAlertMsg');
      alertMsg.innerText = "💾 설정이 이 브라우저에 저장되었습니다!";
      alertBox.style.display = 'block';
    }

    function generateAndCopyLink() {
      const form = getParsedFormValues();
      if (!form) return;

      words = form.parsedWords;
      timeLimit = form.timeVal;
      if (form.newPw) {
        currentPassword = form.newPw;
        localStorage.setItem('typing_admin_pw', currentPassword);
      }

      localStorage.setItem('typing_app_config', JSON.stringify({ w: words, t: timeLimit }));
      updateStartDisplay();

      const payload = { w: words, t: timeLimit };
      const jsonStr = JSON.stringify(payload);
      const encodedHash = btoa(encodeURIComponent(jsonStr));

      const baseUrl = window.location.href.split('#')[0];
      const fullShareUrl = `${baseUrl}#${encodedHash}`;

      window.location.hash = encodedHash;

      navigator.clipboard.writeText(fullShareUrl).then(() => {
        const alertBox = document.getElementById('modalAlertBox');
        const alertMsg = document.getElementById('modalAlertMsg');
        alertMsg.innerHTML = "✨ 학생용 링크가 복사되었습니다!<br>학생들에게 붙여넣기(Ctrl+V)로 공유하세요.";
        alertBox.style.display = 'block';
      }).catch(() => {
        prompt("아래 링크를 복사하여 학생들에게 전달하세요:", fullShareUrl);
      });
    }

    function startGame() {
      currentIndex = 0;
      showScreen('screenGame');
      loadWord();
    }

    function loadWord() {
      if (currentIndex >= words.length) {
        finishGame();
        return;
      }

      document.getElementById('stepCounter').innerText = `${currentIndex + 1} / ${words.length}`;
      document.getElementById('targetWord').innerText = words[currentIndex];

      const input = document.getElementById('userInput');
      input.value = '';
      input.focus();

      clearInterval(timerInterval);
      timeLeft = timeLimit * 1000;
      const totalTime = timeLeft;
      const timerBar = document.getElementById('timerBar');
      timerBar.style.width = '100%';

      const step = 100;
      timerInterval = setInterval(() => {
        timeLeft -= step;
        const percentage = Math.max(0, (timeLeft / totalTime) * 100);
        timerBar.style.width = percentage + '%';

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          currentIndex++;
          loadWord();
        }
      }, step);
    }

    function submitWord() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      clearInterval(timerInterval);
      currentIndex++;
      loadWord();
    }

    function finishGame() {
      clearInterval(timerInterval);
      
      const chipContainer = document.getElementById('completedWordChips');
      chipContainer.innerHTML = '';
      
      words.forEach(w => {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerHTML = `<span>🌱</span> ${w}`;
        chipContainer.appendChild(chip);
      });

      showScreen('screenResult');
    }

    function resetToStart() {
      showScreen('screenStart');
      updateStartDisplay();
    }
  </script>
</body>
</html>
