<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>알록달록 하트 팡팡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Dongle:wght@700&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body, html {
            height: 100%; margin: 0;
            display: flex; justify-content: center; align-items: center;
            background: #fff0f6;
            font-family: 'Jua', sans-serif;
            overflow: hidden; user-select: none;
        }

        /* ── [기본 / PC 환경 스타일: 원본 유지] ── */
        #game-container {
            text-align: center; background: white;
            padding: 20px 40px; border-radius: 50px;
            box-shadow: 0 15px 0 #fcc2d7;
            position: relative; 
            width: 85vw; max-width: 1000px; max-height: 88vh;
            border: 8px solid #faa2c1;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 5;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; border-radius: 40px;
            display: none;
        }

        h1 { color: #f06595; font-size: clamp(30px, 4vw, 50px); margin: 10px 0; }
        .result-msg { font-size: clamp(20px, 2.5vw, 28px); margin-bottom: 20px; color: #495057; }

        .fancy-btn {
            font-family: 'Jua', sans-serif;
            padding: 15px 40px; font-size: 30px; color: white;
            background: #ff6b8b; border: none; border-radius: 100px; cursor: pointer;
            box-shadow: 0 8px 0 #e64980; transition: 0.1s;
        }
        .fancy-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #e64980; }

        #reset-btn {
            position: absolute; bottom: 20px; right: 30px;
            padding: 8px 15px; font-size: 18px; color: #e64980;
            background: #fff0f6; border: 3px solid #faa2c1; border-radius: 20px;
            cursor: pointer; font-family: 'Jua', sans-serif;
            transition: 0.2s; z-index: 10;
        }
        #reset-btn:hover { background: #faa2c1; color: white; }
        #reset-btn:active { transform: scale(0.95); }

        #stats { font-size: clamp(24px, 3vw, 32px); margin-bottom: 15px; color: #495057; position: relative; }
        #time-bonus-msg {
            position: absolute; right: 10%; top: -15px;
            color: #37b24d; font-size: 30px; font-weight: bold; opacity: 0; transition: 0.5s;
        }
        .show-bonus { opacity: 1 !important; transform: translateY(-25px); }

        .heart-container {
            width: clamp(100px, 12vw, 145px); height: clamp(100px, 12vw, 145px);
            position: relative; display: inline-block; cursor: pointer;
            transition: transform 0.1s; filter: drop-shadow(0 10px 0 rgba(0,0,0,0.08));
        }

        .heart-svg { 
            width: 100%; height: 100%; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); 
        }

        .red .heart-base { fill: url(#grad-heart-red); }
        .yellow .heart-base { fill: url(#grad-heart-yellow); }
        .green .heart-base { fill: url(#grad-heart-green); }
        .blue .heart-base { fill: url(#grad-heart-blue); }

        .heart-container:active { transform: translateY(6px) scale(0.95); filter: none; }

        .target-section {
            background: #fff0f6; border-radius: 35px;
            padding: 15px; margin-bottom: 20px; border: 4px dashed #faa2c1;
        }
        .instruction { font-size: clamp(18px, 2vw, 24px); color: #e64980; margin-bottom: 10px; }

        #button-area { display: flex; justify-content: space-around; padding: 10px 0; }

        .ouch-emoji {
            position: absolute; top: -5px; left: 50%; transform: translateX(-50%); 
            font-family: 'Dongle', sans-serif; font-size: 40px; white-space: nowrap; 
            line-height: 1; font-weight: 700; color: #ff6b6b;
            text-shadow: 2px 2px 0 white, -2px -2px 0 white;
            opacity: 0; transition: 0.3s; pointer-events: none; z-index: 10;
        }
        .show-ouch { opacity: 1; transform: translateX(-50%) translateY(-45px) rotate(-5deg); }

        #message-hint { margin-top: 20px; font-size: clamp(22px, 2.5vw, 28px); color: #e64980; height: 35px; }
        .confetti { position: absolute; width: 12px; height: 12px; z-index: 150; pointer-events: none; }

        /* ── [💡 모바일 화면 전용 보완: 768px 이하 기기에서만 작동] ── */
        @media (max-width: 768px) {
            #game-container {
                width: 92vw;
                max-height: 94vh;
                padding: 18px 14px 14px 14px;
                border-radius: 32px;
                border-width: 6px;
                box-shadow: 0 8px 0 #fcc2d7;
            }

            .overlay {
                border-radius: 26px;
                padding: 15px;
            }

            h1 { font-size: 24px; margin: 5px 0; }
            .result-msg { font-size: 15px; margin-bottom: 15px; word-break: keep-all; }
            .fancy-btn { font-size: 20px; padding: 10px 28px; }

            /* 점수판 텍스트 한 줄 정렬 & 줄바꿈 방지 */
            #stats {
                font-size: clamp(15px, 4.2vw, 18px);
                margin-bottom: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                white-space: nowrap;
            }

            #time-bonus-msg {
                font-size: 18px;
                top: -18px;
                right: 2%;
            }

            .target-section {
                padding: 10px 8px;
                border-radius: 20px;
                margin-bottom: 10px;
                border-width: 3px;
            }

            /* 한글 단어 단위 자연스러운 줄바꿈 */
            .instruction {
                font-size: 13.5px;
                margin-bottom: 6px;
                word-break: keep-all;
                line-height: 1.3;
            }

            /* 목표 하트 크기 */
            #target-display {
                width: 72px;
                height: 72px;
            }

            /* 아래 선택 하트 크기 및 간격 */
            #button-area {
                padding: 4px 0;
                justify-content: space-between;
            }

            #button-area .heart-container {
                width: clamp(58px, 17vw, 70px);
                height: clamp(58px, 17vw, 70px);
                filter: drop-shadow(0 4px 0 rgba(0,0,0,0.06));
            }

            .ouch-emoji {
                font-size: 26px;
            }

            /* 하단 안내 문구 */
            #message-hint {
                margin-top: 10px;
                font-size: 16px;
                height: 22px;
            }

            /* 💡 모바일에서 겹치지 않도록 버튼 위치/크기 재정의 */
            #reset-btn {
                position: static;
                margin: 8px auto 0 auto;
                padding: 6px 16px;
                font-size: 14px;
                border-radius: 16px;
                border-width: 2px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>

    <!-- 🌟 통통한 3D 유광 하트 그래픽 정의 -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <radialGradient id="grad-heart-red" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#ff7b7b" />
                <stop offset="50%" stop-color="#e03131" />
                <stop offset="100%" stop-color="#8f101c" />
            </radialGradient>
            <radialGradient id="grad-heart-yellow" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#fff9db" />
                <stop offset="45%" stop-color="#ffd43b" />
                <stop offset="100%" stop-color="#e67700" />
            </radialGradient>
            <radialGradient id="grad-heart-green" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#96f2d7" />
                <stop offset="45%" stop-color="#40c057" />
                <stop offset="100%" stop-color="#1b6426" />
            </radialGradient>
            <radialGradient id="grad-heart-blue" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#a5d8ff" />
                <stop offset="45%" stop-color="#339af0" />
                <stop offset="100%" stop-color="#1864ab" />
            </radialGradient>
        </defs>
    </svg>

    <div id="game-container">
        <div id="start-layer" class="overlay" style="display: flex;">
            <h1>💖 알록달록 하트 팡팡</h1>
            <p class="result-msg">똑같은 색깔의 하트를 고르세요!<br>10개를 맞히면 시간이 늘어나요!</p>
            <button class="fancy-btn" onclick="startGame()">하트 여행 시작!</button>
        </div>

        <div id="result-layer" class="overlay">
            <h1 id="result-title">참 잘했어요!</h1>
            <p id="result-body" class="result-msg"></p>
            <button class="fancy-btn" onclick="startGame()">다시 도전하기!</button>
        </div>

        <div id="stats">
            <span>⏰ 시간: <span id="time" style="color:#e03131">30</span>초</span>
            <span>|</span>
            <span>🎯 맞힌 개수: <span id="progress">0</span> / 30</span>
            <div id="time-bonus-msg">+5초 보너스! ✨</div>
        </div>

        <div class="target-section">
            <div class="instruction">이 하트와 똑같은 색을 아래에서 찾으세요!</div>
            <div id="target-display" class="heart-container red" style="cursor: default;">
                <svg class="heart-svg" viewBox="0 0 100 100">
                    <path class="heart-base" d="M50,84 C32,72 10,58 10,34 C10,18 22,8 35,8 C42,8 47,13 50,19 C53,13 58,8 65,8 C78,8 90,18 90,34 C90,58 68,72 50,84 Z" />
                    <ellipse cx="33" cy="24" rx="13" ry="8" transform="rotate(-28 33 24)" fill="white" fill-opacity="0.65" />
                    <ellipse cx="67" cy="24" rx="10" ry="6" transform="rotate(28 67 24)" fill="white" fill-opacity="0.45" />
                </svg>
            </div>
        </div>

        <div id="button-area">
            <div class="heart-container red" onclick="checkAnswer('red', this)">
                <svg class="heart-svg" viewBox="0 0 100 100">
                    <path class="heart-base" d="M50,84 C32,72 10,58 10,34 C10,18 22,8 35,8 C42,8 47,13 50,19 C53,13 58,8 65,8 C78,8 90,18 90,34 C90,58 68,72 50,84 Z" />
                    <ellipse cx="33" cy="24" rx="13" ry="8" transform="rotate(-28 33 24)" fill="white" fill-opacity="0.65" />
                    <ellipse cx="67" cy="24" rx="10" ry="6" transform="rotate(28 67 24)" fill="white" fill-opacity="0.45" />
                </svg>
                <span class="ouch-emoji">아야!</span>
            </div>
            <div class="heart-container yellow" onclick="checkAnswer('yellow', this)">
                <svg class="heart-svg" viewBox="0 0 100 100">
                    <path class="heart-base" d="M50,84 C32,72 10,58 10,34 C10,18 22,8 35,8 C42,8 47,13 50,19 C53,13 58,8 65,8 C78,8 90,18 90,34 C90,58 68,72 50,84 Z" />
                    <ellipse cx="33" cy="24" rx="13" ry="8" transform="rotate(-28 33 24)" fill="white" fill-opacity="0.65" />
                    <ellipse cx="67" cy="24" rx="10" ry="6" transform="rotate(28 67 24)" fill="white" fill-opacity="0.45" />
                </svg>
                <span class="ouch-emoji">아야!</span>
            </div>
            <div class="heart-container green" onclick="checkAnswer('green', this)">
                <svg class="heart-svg" viewBox="0 0 100 100">
                    <path class="heart-base" d="M50,84 C32,72 10,58 10,34 C10,18 22,8 35,8 C42,8 47,13 50,19 C53,13 58,8 65,8 C78,8 90,18 90,34 C90,58 68,72 50,84 Z" />
                    <ellipse cx="33" cy="24" rx="13" ry="8" transform="rotate(-28 33 24)" fill="white" fill-opacity="0.65" />
                    <ellipse cx="67" cy="24" rx="10" ry="6" transform="rotate(28 67 24)" fill="white" fill-opacity="0.45" />
                </svg>
                <span class="ouch-emoji">아야!</span>
            </div>
            <div class="heart-container blue" onclick="checkAnswer('blue', this)">
                <svg class="heart-svg" viewBox="0 0 100 100">
                    <path class="heart-base" d="M50,84 C32,72 10,58 10,34 C10,18 22,8 35,8 C42,8 47,13 50,19 C53,13 58,8 65,8 C78,8 90,18 90,34 C90,58 68,72 50,84 Z" />
                    <ellipse cx="33" cy="24" rx="13" ry="8" transform="rotate(-28 33 24)" fill="white" fill-opacity="0.65" />
                    <ellipse cx="67" cy="24" rx="10" ry="6" transform="rotate(28 67 24)" fill="white" fill-opacity="0.45" />
                </svg>
                <span class="ouch-emoji">아야!</span>
            </div>
        </div>

        <div id="message-hint">어떤 하트가 똑같을까~?</div>

        <button id="reset-btn" onclick="resetGame()">처음부터 다시</button>
    </div>

    <script>
        let timeLeft = 30, problemCount = 0, targetColor = "", timerInterval, isClickable = true;
        const colors = ['red', 'yellow', 'green', 'blue'];

        function startGame() {
            document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
            timeLeft = 30; problemCount = 0;
            updateStats(); nextProblem(); startTimer();
        }

        function resetGame() {
            if(confirm("정말 처음부터 다시 시작할까요?")) {
                clearInterval(timerInterval);
                startGame();
            }
        }

        function updateStats() {
            document.getElementById('progress').innerText = problemCount;
            document.getElementById('time').innerText = timeLeft;
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--; updateStats();
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function nextProblem() {
            if (problemCount >= 30) { endGame(); return; }
            let newColor;
            do { 
                newColor = colors[Math.floor(Math.random() * colors.length)]; 
            } while (newColor === targetColor);
            
            targetColor = newColor;
            document.getElementById('target-display').className = 'heart-container ' + targetColor;
        }

        function checkAnswer(color, btn) {
            if (timeLeft <= 0 || !isClickable) return;
            if (color === targetColor) {
                isClickable = false;
                btn.style.filter = 'brightness(1.2) drop-shadow(0 0 18px #ff6b8b)';
                document.getElementById('message-hint').innerText = "와! 정답이야! 💖";
                setTimeout(() => {
                    btn.style.filter = 'drop-shadow(0 10px 0 rgba(0,0,0,0.08))';
                    problemCount++;
                    if (problemCount > 0 && problemCount % 10 === 0 && problemCount < 30) {
                        timeLeft += 5; showBonusEffect();
                    }
                    updateStats(); isClickable = true; nextProblem();
                }, 300);
            } else {
                const ouch = btn.querySelector('.ouch-emoji');
                if(ouch.classList.contains('show-ouch')) return;
                ouch.classList.add('show-ouch');
                document.getElementById('message-hint').innerText = "다른 하트인 것 같아! 😊";
                setTimeout(() => ouch.classList.remove('show-ouch'), 600);
            }
        }

        function showBonusEffect() {
            const msg = document.getElementById('time-bonus-msg');
            msg.classList.add('show-bonus');
            setTimeout(() => { msg.classList.remove('show-bonus'); }, 1000);
        }

        function fireConfetti() {
            const colors = ['#ff8787', '#fab005', '#37b24d', '#1c7ed6', '#f06595'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                document.body.appendChild(confetti);
                confetti.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${(Math.random() - 0.5) * 200}px, ${window.innerHeight}px, 0) rotate(720deg)`, opacity: 0 }
                ], { duration: Math.random() * 2000 + 2000, easing: 'ease-out' }).onfinish = () => confetti.remove();
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            const resLayer = document.getElementById('result-layer');
            resLayer.style.display = 'flex';
            if (problemCount >= 30) {
                document.getElementById('result-title').innerText = "🎊 성공! 🎊";
                document.getElementById('result-body').innerHTML = `빛나는 실력이네요!<br>남은 시간: ${timeLeft}초`;
                fireConfetti();
            } else {
                document.getElementById('result-title').innerText = "🎈 한번 더 해볼까? 🎈";
                document.getElementById('result-body').innerHTML = `끝까지 잘했어요!<br>찾은 개수: ${problemCount}개`;
            }
        }
    </script>
</body>
</html>
