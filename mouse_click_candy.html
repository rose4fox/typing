<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>알록달록 솜사탕 팡팡</title>
    <meta property="og:title" content="🍭 알록달록 솜사탕 팡팡">
    <meta property="og:description" content="누구나 쉽고 재미있게 즐기는 색깔 맞히기 순발력 게임">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Dongle:wght@700&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body, html {
            height: 100%; margin: 0;
            display: flex; justify-content: center; align-items: center;
            background: #fff4e6;
            font-family: 'Jua', sans-serif;
            overflow: hidden; user-select: none;
        }

        /* ── [기본 / PC 환경 스타일: 원본 유지] ── */
        #game-container {
            text-align: center; background: white;
            padding: 20px 40px; border-radius: 50px;
            box-shadow: 0 15px 0 #ffd8a8;
            position: relative; 
            width: 85vw; max-width: 1000px; max-height: 88vh;
            border: 8px solid #ffa94d;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 5;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; border-radius: 40px;
            display: none;
        }

        h1 { color: #f76707; font-size: clamp(30px, 4vw, 50px); margin: 10px 0; }
        .result-msg { font-size: clamp(20px, 2.5vw, 28px); margin-bottom: 20px; color: #495057; }

        .fancy-btn {
            font-family: 'Jua', sans-serif;
            padding: 15px 40px; font-size: 30px; color: white;
            background: #ff922b; border: none; border-radius: 100px; cursor: pointer;
            box-shadow: 0 8px 0 #d9480f; transition: 0.1s;
        }
        .fancy-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #d9480f; }

        #reset-btn {
            position: absolute; bottom: 20px; right: 30px;
            padding: 8px 15px; font-size: 18px; color: #f76707;
            background: #fff4e6; border: 3px solid #ffa94d; border-radius: 20px;
            cursor: pointer; font-family: 'Jua', sans-serif;
            transition: 0.2s; z-index: 10;
        }
        #reset-btn:hover { background: #ffa94d; color: white; }
        #reset-btn:active { transform: scale(0.95); }

        #stats { font-size: clamp(24px, 3vw, 32px); margin-bottom: 15px; color: #495057; position: relative; }
        #time-bonus-msg {
            position: absolute; right: 10%; top: -15px;
            color: #2b8a3e; font-size: 30px; font-weight: bold; opacity: 0; transition: 0.5s;
        }
        .show-bonus { opacity: 1 !important; transform: translateY(-25px); }

        .candy-container {
            width: clamp(105px, 13vw, 150px); height: clamp(105px, 13vw, 150px);
            position: relative; display: inline-block; cursor: pointer;
            filter: drop-shadow(0 10px 0 rgba(0,0,0,0.06));
        }

        .candy-svg { 
            width: 100%; height: 100%; 
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08)); 
        }

        /* 🎈 솜사탕 둥실둥실 흔들림 애니메이션 */
        .float-1 { animation: floating1 2.2s infinite ease-in-out alternate; }
        .float-2 { animation: floating2 2.6s infinite ease-in-out alternate; }
        .float-3 { animation: floating3 2.0s infinite ease-in-out alternate; }
        .float-4 { animation: floating4 2.4s infinite ease-in-out alternate; }

        @keyframes floating1 {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-14px) translateX(6px) rotate(3deg); }
        }
        @keyframes floating2 {
            0% { transform: translateY(-10px) translateX(-5px) rotate(-3deg); }
            100% { transform: translateY(8px) translateX(5px) rotate(2deg); }
        }
        @keyframes floating3 {
            0% { transform: translateY(6px) translateX(6px) rotate(2deg); }
            100% { transform: translateY(-12px) translateX(-6px) rotate(-3deg); }
        }
        @keyframes floating4 {
            0% { transform: translateY(0px) translateX(-6px) rotate(-2deg); }
            100% { transform: translateY(-15px) translateX(4px) rotate(3deg); }
        }

        /* 솜사탕 파스텔 색상 매핑 */
        .pink .candy-puff-base { fill: url(#grad-candy-pink-base); }
        .pink .candy-puff-mid { fill: url(#grad-candy-pink-mid); }
        .pink .candy-puff-top { fill: url(#grad-candy-pink-top); }

        .yellow .candy-puff-base { fill: url(#grad-candy-yellow-base); }
        .yellow .candy-puff-mid { fill: url(#grad-candy-yellow-mid); }
        .yellow .candy-puff-top { fill: url(#grad-candy-yellow-top); }

        .blue .candy-puff-base { fill: url(#grad-candy-blue-base); }
        .blue .candy-puff-mid { fill: url(#grad-candy-blue-mid); }
        .blue .candy-puff-top { fill: url(#grad-candy-blue-top); }

        .purple .candy-puff-base { fill: url(#grad-candy-purple-base); }
        .purple .candy-puff-mid { fill: url(#grad-candy-purple-mid); }
        .purple .candy-puff-top { fill: url(#grad-candy-purple-top); }

        .target-section {
            background: #fff4e6; border-radius: 35px;
            padding: 15px; margin-bottom: 15px; border: 4px dashed #ffa94d;
        }
        .instruction { font-size: clamp(18px, 2vw, 24px); color: #f76707; margin-bottom: 8px; }

        #button-area { 
            display: flex; justify-content: space-around; 
            padding: 15px 0; align-items: center; 
            min-height: 170px;
        }

        .ouch-emoji {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); 
            font-family: 'Dongle', sans-serif; font-size: 40px; white-space: nowrap; 
            line-height: 1; font-weight: 700; color: #ff6b6b;
            text-shadow: 2px 2px 0 white, -2px -2px 0 white;
            opacity: 0; transition: 0.3s; pointer-events: none; z-index: 10;
        }
        .show-ouch { opacity: 1; transform: translateX(-50%) translateY(-45px) rotate(-5deg); }

        #message-hint { margin-top: 10px; font-size: clamp(22px, 2.5vw, 28px); color: #f76707; height: 35px; }
        .confetti { position: absolute; width: 12px; height: 12px; z-index: 150; pointer-events: none; }

        /* ── [모바일 전용 보완 스타일: 768px 이하 기기에서만 작동] ── */
        @media (max-width: 768px) {
            #game-container {
                width: 92vw;
                max-height: 94vh;
                padding: 18px 14px 14px 14px;
                border-radius: 32px;
                border-width: 6px;
                box-shadow: 0 8px 0 #ffd8a8;
            }

            .overlay {
                border-radius: 26px;
                padding: 15px;
            }

            h1 { font-size: 24px; margin: 5px 0; }
            .result-msg { font-size: 15px; margin-bottom: 15px; word-break: keep-all; }
            .fancy-btn { font-size: 20px; padding: 10px 28px; }

            #stats {
                font-size: clamp(15px, 4.2vw, 18px);
                margin-bottom: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                white-space: nowrap;
            }

            #time-bonus-msg {
                font-size: 18px;
                top: -18px;
                right: 2%;
            }

            .target-section {
                padding: 10px 8px;
                border-radius: 20px;
                margin-bottom: 10px;
                border-width: 3px;
            }

            .instruction {
                font-size: 13.5px;
                margin-bottom: 6px;
                word-break: keep-all;
                line-height: 1.3;
            }

            #target-display {
                width: 76px;
                height: 76px;
            }

            #button-area {
                padding: 4px 0;
                min-height: 100px;
                justify-content: space-between;
            }

            #button-area .candy-container {
                width: clamp(60px, 18vw, 74px);
                height: clamp(60px, 18vw, 74px);
                filter: drop-shadow(0 4px 0 rgba(0,0,0,0.06));
            }

            .ouch-emoji {
                font-size: 26px;
                top: -6px;
            }

            #message-hint {
                margin-top: 8px;
                font-size: 16px;
                height: 22px;
            }

            #reset-btn {
                position: static;
                margin: 8px auto 0 auto;
                padding: 6px 16px;
                font-size: 14px;
                border-radius: 16px;
                border-width: 2px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>

    <!-- 🌟 몽실몽실 파스텔 솜사탕 그라데이션 정의 -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="grad-stick" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#edf2f7" />
                <stop offset="35%" stop-color="#ffffff" />
                <stop offset="70%" stop-color="#edf2f7" />
                <stop offset="100%" stop-color="#cbd5e1" />
            </linearGradient>

            <!-- 🌸 파스텔 핑크 -->
            <radialGradient id="grad-candy-pink-base" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffd5e5" />
                <stop offset="70%" stop-color="#ffa8c5" />
                <stop offset="100%" stop-color="#f783ac" />
            </radialGradient>
            <radialGradient id="grad-candy-pink-mid" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#ffe3ec" />
                <stop offset="100%" stop-color="#ffb6cf" />
            </radialGradient>
            <radialGradient id="grad-candy-pink-top" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#ffdeeb" />
                <stop offset="100%" stop-color="#ffa3c4" />
            </radialGradient>

            <!-- 🍋 파스텔 옐로우 -->
            <radialGradient id="grad-candy-yellow-base" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff9db" />
                <stop offset="70%" stop-color="#ffec99" />
                <stop offset="100%" stop-color="#fcc419" />
            </radialGradient>
            <radialGradient id="grad-candy-yellow-mid" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#fffde6" />
                <stop offset="100%" stop-color="#ffe066" />
            </radialGradient>
            <radialGradient id="grad-candy-yellow-top" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#fff9db" />
                <stop offset="100%" stop-color="#ffd43b" />
            </radialGradient>

            <!-- 🫐 파스텔 블루 -->
            <radialGradient id="grad-candy-blue-base" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#d0ebff" />
                <stop offset="70%" stop-color="#a5d8ff" />
                <stop offset="100%" stop-color="#74c0fc" />
            </radialGradient>
            <radialGradient id="grad-candy-blue-mid" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#e7f5ff" />
                <stop offset="100%" stop-color="#bfe3ff" />
            </radialGradient>
            <radialGradient id="grad-candy-blue-top" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#dbeeff" />
                <stop offset="100%" stop-color="#91a7ff" />
            </radialGradient>

            <!-- 🍇 파스텔 퍼플 -->
            <radialGradient id="grad-candy-purple-base" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#f3d9fa" />
                <stop offset="70%" stop-color="#e599f7" />
                <stop offset="100%" stop-color="#da77f2" />
            </radialGradient>
            <radialGradient id="grad-candy-purple-mid" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#f8f0fc" />
                <stop offset="100%" stop-color="#eebefa" />
            </radialGradient>
            <radialGradient id="grad-candy-purple-top" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#f3d9fa" />
                <stop offset="100%" stop-color="#cc5de8" />
            </radialGradient>
        </defs>
    </svg>

    <div id="game-container">
        <div id="start-layer" class="overlay" style="display: flex;">
            <h1>🍭 알록달록 솜사탕 팡팡</h1>
            <p class="result-msg">흔들리는 솜사탕 중 똑같은 색을 고르세요!<br>10개를 맞히면 시간이 늘어나요!</p>
            <button class="fancy-btn" onclick="startGame()">솜사탕 여행 시작!</button>
        </div>

        <div id="result-layer" class="overlay">
            <h1 id="result-title">참 잘했어요!</h1>
            <p id="result-body" class="result-msg"></p>
            <button class="fancy-btn" onclick="startGame()">다시 도전하기!</button>
        </div>

        <div id="stats">
            <span>⏰ 시간: <span id="time" style="color:#e03131">30</span>초</span>
            <span>|</span>
            <span>🎯 맞힌 개수: <span id="progress">0</span> / 30</span>
            <div id="time-bonus-msg">+5초 보너스! ✨</div>
        </div>

        <div class="target-section">
            <div class="instruction">이 솜사탕과 똑같은 색을 아래에서 찾으세요!</div>
            <div id="target-display" class="candy-container pink" style="cursor: default;"></div>
        </div>

        <div id="button-area"></div>

        <div id="message-hint">어떤 솜사탕이 똑같을까~?</div>

        <button id="reset-btn" onclick="resetGame()">처음부터 다시</button>
    </div>

    <script>
        let timeLeft = 30, problemCount = 0, targetColor = "", timerInterval, isClickable = true;
        const colors = ['pink', 'yellow', 'blue', 'purple'];
        const floatClasses = ['float-1', 'float-2', 'float-3', 'float-4'];

        function getCottonCandySVG() {
            return `
                <svg class="candy-svg" viewBox="0 0 100 110">
                    <path d="M 46 68 L 47 106 C 47 108 53 108 53 106 L 54 68 Z" fill="url(#grad-stick)" stroke="#cbd5e1" stroke-width="0.8" />
                    
                    <circle class="candy-puff-base" cx="34" cy="58" r="17" />
                    <circle class="candy-puff-base" cx="66" cy="58" r="17" />
                    <circle class="candy-puff-base" cx="50" cy="62" r="16" />

                    <circle class="candy-puff-mid" cx="25" cy="40" r="18" />
                    <circle class="candy-puff-mid" cx="75" cy="40" r="18" />
                    <circle class="candy-puff-mid" cx="50" cy="44" r="23" />

                    <circle class="candy-puff-top" cx="37" cy="24" r="18" />
                    <circle class="candy-puff-top" cx="63" cy="24" r="18" />
                    <circle class="candy-puff-top" cx="50" cy="18" r="16" />

                    <ellipse cx="38" cy="18" rx="8" ry="4" transform="rotate(-20 38 18)" fill="white" fill-opacity="0.6" />
                    <ellipse cx="26" cy="36" rx="7" ry="3.5" transform="rotate(-30 26 36)" fill="white" fill-opacity="0.5" />
                    <circle cx="68" cy="28" r="4.5" fill="white" fill-opacity="0.45" />
                    <circle cx="56" cy="38" r="3" fill="white" fill-opacity="0.4" />
                </svg>
            `;
        }

        function startGame() {
            document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
            timeLeft = 30; problemCount = 0;
            updateStats(); nextProblem(); startTimer();
        }

        function resetGame() {
            if(confirm("정말 처음부터 다시 시작할까요?")) {
                clearInterval(timerInterval);
                startGame();
            }
        }

        function updateStats() {
            document.getElementById('progress').innerText = problemCount;
            document.getElementById('time').innerText = timeLeft;
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--; updateStats();
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function renderButtons() {
            const btnArea = document.getElementById('button-area');
            btnArea.innerHTML = '';
            
            const shuffledColors = [...colors].sort(() => Math.random() - 0.5);
            const shuffledFloats = [...floatClasses].sort(() => Math.random() - 0.5);

            shuffledColors.forEach((color, idx) => {
                const btn = document.createElement('div');
                btn.className = `candy-container ${color} ${shuffledFloats[idx]}`;
                btn.onclick = () => checkAnswer(color, btn);
                btn.innerHTML = getCottonCandySVG() + `<span class="ouch-emoji">아야!</span>`;
                btnArea.appendChild(btn);
            });
        }

        function nextProblem() {
            if (problemCount >= 30) { endGame(); return; }
            let newColor;
            do { 
                newColor = colors[Math.floor(Math.random() * colors.length)]; 
            } while (newColor === targetColor);
            
            targetColor = newColor;
            const targetDisplay = document.getElementById('target-display');
            targetDisplay.className = 'candy-container ' + targetColor;
            targetDisplay.innerHTML = getCottonCandySVG();
            renderButtons();
        }

        function checkAnswer(color, btn) {
            if (timeLeft <= 0 || !isClickable) return;
            if (color === targetColor) {
                isClickable = false;
                btn.style.filter = 'brightness(1.15) drop-shadow(0 0 16px #ff922b)';
                document.getElementById('message-hint').innerText = "와! 달콤하고 폭신한 정답이야! 🍭";
                setTimeout(() => {
                    btn.style.filter = 'drop-shadow(0 10px 0 rgba(0,0,0,0.06))';
                    problemCount++;
                    if (problemCount > 0 && problemCount % 10 === 0 && problemCount < 30) {
                        timeLeft += 5; showBonusEffect();
                    }
                    updateStats(); isClickable = true; nextProblem();
                }, 300);
            } else {
                const ouch = btn.querySelector('.ouch-emoji');
                if(ouch && ouch.classList.contains('show-ouch')) return;
                if(ouch) {
                    ouch.classList.add('show-ouch');
                    document.getElementById('message-hint').innerText = "다른 솜사탕인 것 같아! 😊";
                    setTimeout(() => ouch.classList.remove('show-ouch'), 600);
                }
            }
        }

        function showBonusEffect() {
            const msg = document.getElementById('time-bonus-msg');
            msg.classList.add('show-bonus');
            setTimeout(() => { msg.classList.remove('show-bonus'); }, 1000);
        }

        function fireConfetti() {
            const confettiColors = ['#ffa8c5', '#ffec99', '#a5d8ff', '#e599f7', '#ffd43b'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                document.body.appendChild(confetti);
                confetti.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${(Math.random() - 0.5) * 200}px, ${window.innerHeight}px, 0) rotate(720deg)`, opacity: 0 }
                ], { duration: Math.random() * 2000 + 2000, easing: 'ease-out' }).onfinish = () => confetti.remove();
            }
        }

        document.getElementById('target-display').innerHTML = getCottonCandySVG();
    </script>
</body>
</html>
