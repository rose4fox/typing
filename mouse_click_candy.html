<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알록달록 솜사탕 팡팡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Dongle:wght@700&display=swap');

        body, html {
            height: 100%; margin: 0;
            display: flex; justify-content: center; align-items: center;
            background: #fff4e6; /* 🍊 따뜻하고 화사한 오렌지 파스텔 배경 */
            font-family: 'Jua', sans-serif;
            overflow: hidden; user-select: none;
        }

        #game-container {
            text-align: center; background: white;
            padding: 20px 40px; border-radius: 50px;
            box-shadow: 0 15px 0 #ffd8a8;
            position: relative; 
            width: 85vw; max-width: 1000px; max-height: 88vh;
            border: 8px solid #ffa94d;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 5;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; border-radius: 40px;
            display: none;
        }

        h1 { color: #f76707; font-size: clamp(30px, 4vw, 50px); margin: 10px 0; }
        .result-msg { font-size: clamp(20px, 2.5vw, 28px); margin-bottom: 20px; color: #495057; }

        .fancy-btn {
            font-family: 'Jua', sans-serif;
            padding: 15px 40px; font-size: 30px; color: white;
            background: #ff922b; border: none; border-radius: 100px; cursor: pointer;
            box-shadow: 0 8px 0 #d9480f; transition: 0.1s;
        }
        .fancy-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #d9480f; }

        /* 🔄 게임 중 다시 시작 버튼 스타일 */
        #reset-btn {
            position: absolute; bottom: 20px; right: 30px;
            padding: 8px 15px; font-size: 18px; color: #f76707;
            background: #fff4e6; border: 3px solid #ffa94d; border-radius: 20px;
            cursor: pointer; font-family: 'Jua', sans-serif;
            transition: 0.2s; z-index: 10;
        }
        #reset-btn:hover { background: #ffa94d; color: white; }
        #reset-btn:active { transform: scale(0.95); }

        #stats { font-size: clamp(24px, 3vw, 32px); margin-bottom: 15px; color: #495057; position: relative; }
        #time-bonus-msg {
            position: absolute; right: 10%; top: -15px;
            color: #2b8a3e; font-size: 30px; font-weight: bold; opacity: 0; transition: 0.5s;
        }
        .show-bonus { opacity: 1 !important; transform: translateY(-25px); }

        .candy-container {
            width: clamp(105px, 13vw, 150px); height: clamp(105px, 13vw, 150px);
            position: relative; display: inline-block; cursor: pointer;
            transition: transform 0.1s; filter: drop-shadow(0 10px 0 rgba(0,0,0,0.08));
        }

        .candy-svg { 
            width: 100%; height: 100%; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); 
        }

        /* 3D 솜사탕 신규 4종 색상 (핑크/오렌지/네이비/퍼플) */
        .pink .candy-puff { fill: url(#grad-candy-pink); }
        .orange .candy-puff { fill: url(#grad-candy-orange); }
        .navy .candy-puff { fill: url(#grad-candy-navy); }
        .purple .candy-puff { fill: url(#grad-candy-purple); }

        .candy-container:active { transform: translateY(6px) scale(0.95); filter: none; }

        .target-section {
            background: #fff4e6; border-radius: 35px;
            padding: 15px; margin-bottom: 15px; border: 4px dashed #ffa94d;
        }
        .instruction { font-size: clamp(18px, 2vw, 24px); color: #f76707; margin-bottom: 8px; }

        #button-area { display: flex; justify-content: space-around; padding: 10px 0; align-items: center; }

        .ouch-emoji {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); 
            font-family: 'Dongle', sans-serif; font-size: 40px; white-space: nowrap; 
            line-height: 1; font-weight: 700; color: #ff6b6b;
            text-shadow: 2px 2px 0 white, -2px -2px 0 white;
            opacity: 0; transition: 0.3s; pointer-events: none; z-index: 10;
        }
        .show-ouch { opacity: 1; transform: translateX(-50%) translateY(-45px) rotate(-5deg); }

        #message-hint { margin-top: 15px; font-size: clamp(22px, 2.5vw, 28px); color: #f76707; height: 35px; }
        .confetti { position: absolute; width: 12px; height: 12px; z-index: 150; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 🌟 100% 투명 배경 + 4종 색상 그래디언트 정의 -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="grad-stick" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e9ecef" />
                <stop offset="50%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#ced4da" />
            </linearGradient>

            <!-- 1. 핑크 솜사탕 -->
            <radialGradient id="grad-candy-pink" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#ffc9db" />
                <stop offset="45%" stop-color="#f783ac" />
                <stop offset="100%" stop-color="#c2255c" />
            </radialGradient>
            <!-- 2. 오렌지 솜사탕 -->
            <radialGradient id="grad-candy-orange" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#ffe8cc" />
                <stop offset="45%" stop-color="#ff922b" />
                <stop offset="100%" stop-color="#d9480f" />
            </radialGradient>
            <!-- 3. 네이비 솜사탕 -->
            <radialGradient id="grad-candy-navy" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#748ffc" />
                <stop offset="45%" stop-color="#364fc7" />
                <stop offset="100%" stop-color="#182463" />
            </radialGradient>
            <!-- 4. 퍼플 솜사탕 -->
            <radialGradient id="grad-candy-purple" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#eebefa" />
                <stop offset="45%" stop-color="#ae3ec9" />
                <stop offset="100%" stop-color="#5f1875" />
            </radialGradient>
        </defs>
    </svg>

    <div id="game-container">
        <div id="start-layer" class="overlay" style="display: flex;">
            <h1>🍭 알록달록 솜사탕 팡팡</h1>
            <p class="result-msg">똑같은 색깔의 솜사탕을 고르세요!<br>10개를 맞히면 시간이 늘어나요!</p>
            <button class="fancy-btn" onclick="startGame()">솜사탕 여행 시작!</button>
        </div>

        <div id="result-layer" class="overlay">
            <h1 id="result-title">참 잘했어요!</h1>
            <p id="result-body" class="result-msg"></p>
            <button class="fancy-btn" onclick="startGame()">다시 도전하기!</button>
        </div>

        <div id="stats">
            ⏰ 시간: <span id="time" style="color:#e03131">30</span>초 | 🎯 맞힌 개수: <span id="progress">0</span> / 30
            <div id="time-bonus-msg">+5초 보너스! ✨</div>
        </div>

        <div class="target-section">
            <div class="instruction">이 솜사탕과 똑같은 색을 아래에서 찾으세요!</div>
            <div id="target-display" class="candy-container orange" style="cursor: default;">
                <svg class="candy-svg" viewBox="0 0 100 100">
                    <rect x="45" y="70" width="10" height="26" rx="5" fill="url(#grad-stick)" stroke="#adb5bd" stroke-width="1.5" />
                    <path class="candy-puff" d="M 50 6 C 68 6 84 18 86 34 C 98 40 98 64 85 75 C 73 84 27 84 15 75 C 2 64 2 40 14 34 C 16 18 32 6 50 6 Z" />
                    <ellipse cx="38" cy="22" rx="16" ry="8" transform="rotate(-20 38 22)" fill="white" fill-opacity="0.65" />
                    <ellipse cx="72" cy="38" rx="10" ry="5" transform="rotate(20 72 38)" fill="white" fill-opacity="0.45" />
                    <circle cx="56" cy="46" r="4.5" fill="white" fill-opacity="0.35" />
                </svg>
            </div>
        </div>

        <div id="button-area"></div>

        <div id="message-hint">어떤 솜사탕이 똑같을까~?</div>

        <button id="reset-btn" onclick="resetGame()">처음부터 다시</button>
    </div>

    <script>
        let timeLeft = 30, problemCount = 0, targetColor = "", timerInterval, isClickable = true;
        const colors = ['pink', 'orange', 'navy', 'purple'];

        function startGame() {
            document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
            timeLeft = 30; problemCount = 0;
            updateStats(); nextProblem(); startTimer();
        }

        function resetGame() {
            if(confirm("정말 처음부터 다시 시작할까요?")) {
                clearInterval(timerInterval);
                startGame();
            }
        }

        function updateStats() {
            document.getElementById('progress').innerText = problemCount;
            document.getElementById('time').innerText = timeLeft;
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--; updateStats();
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function renderButtons() {
            const btnArea = document.getElementById('button-area');
            btnArea.innerHTML = '';
            
            const shuffledColors = [...colors].sort(() => Math.random() - 0.5);

            shuffledColors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = `candy-container ${color}`;
                btn.onclick = () => checkAnswer(color, btn);
                btn.innerHTML = `
                    <svg class="candy-svg" viewBox="0 0 100 100">
                        <rect x="45" y="70" width="10" height="26" rx="5" fill="url(#grad-stick)" stroke="#adb5bd" stroke-width="1.5" />
                        <path class="candy-puff" d="M 50 6 C 68 6 84 18 86 34 C 98 40 98 64 85 75 C 73 84 27 84 15 75 C 2 64 2 40 14 34 C 16 18 32 6 50 6 Z" />
                        <ellipse cx="38" cy="22" rx="16" ry="8" transform="rotate(-20 38 22)" fill="white" fill-opacity="0.65" />
                        <ellipse cx="72" cy="38" rx="10" ry="5" transform="rotate(20 72 38)" fill="white" fill-opacity="0.45" />
                        <circle cx="56" cy="46" r="4.5" fill="white" fill-opacity="0.35" />
                    </svg>
                    <span class="ouch-emoji">아야!</span>
                `;
                btnArea.appendChild(btn);
            });
        }

        function nextProblem() {
            if (problemCount >= 30) { endGame(); return; }
            let newColor;
            do { 
                newColor = colors[Math.floor(Math.random() * colors.length)]; 
            } while (newColor === targetColor);
            
            targetColor = newColor;
            document.getElementById('target-display').className = 'candy-container ' + targetColor;
            renderButtons();
        }

        function checkAnswer(color, btn) {
            if (timeLeft <= 0 || !isClickable) return;
            if (color === targetColor) {
                isClickable = false;
                btn.style.filter = 'brightness(1.25) drop-shadow(0 0 18px #ff922b)';
                document.getElementById('message-hint').innerText = "와! 달콤한 정답이야! 🍭";
                setTimeout(() => {
                    btn.style.filter = 'drop-shadow(0 10px 0 rgba(0,0,0,0.08))';
                    problemCount++;
                    if (problemCount > 0 && problemCount % 10 === 0 && problemCount < 30) {
                        timeLeft += 5; showBonusEffect();
                    }
                    updateStats(); isClickable = true; nextProblem();
                }, 300);
            } else {
                const ouch = btn.querySelector('.ouch-emoji');
                if(ouch.classList.contains('show-ouch')) return;
                ouch.classList.add('show-ouch');
                document.getElementById('message-hint').innerText = "다른 솜사탕인 것 같아! 😊";
                setTimeout(() => ouch.classList.remove('show-ouch'), 600);
            }
        }

        function showBonusEffect() {
            const msg = document.getElementById('time-bonus-msg');
            msg.classList.add('show-bonus');
            setTimeout(() => { msg.classList.remove('show-bonus'); }, 1000);
        }

        function fireConfetti() {
            const confettiColors = ['#f783ac', '#ff922b', '#748ffc', '#ae3ec9', '#ffd43b'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                document.body.appendChild(confetti);
                confetti.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${(Math.random() - 0.5) * 200}px, ${window.innerHeight}px, 0) rotate(720deg)`, opacity: 0 }
                ], { duration: Math.random() * 2000 + 2000, easing: 'ease-out' }).onfinish = () => confetti.remove();
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            const resLayer = document.getElementById('result-layer');
            resLayer.style.display = 'flex';
            if (problemCount >= 30) {
                document.getElementById('result-title').innerText = "🎊 성공! 🎊";
                document.getElementById('result-body').innerHTML = `빛나는 실력이네요!<br>남은 시간: ${timeLeft}초`;
                fireConfetti();
            } else {
                document.getElementById('result-title').innerText = "🎈 한번 더 해볼까? 🎈";
                document.getElementById('result-body').innerHTML = `끝까지 잘했어요!<br>찾은 개수: ${problemCount}개`;
            }
        }
    </script>
</body>
</html>
